<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML-форми. Регулярні вирази</title>
        <link rel="stylesheet" href="./assets/styles/main.css" />
    </head>
    <body>
        <form class="form" action="#" method="post">
            <div class="form__bg"></div>
            <div class="form__header">
                <h2 class="form__title">Contact form</h2>
                <p class="form__subtitle">
                    Please fill in your information and we'll be sending your
                    order.
                </p>
            </div>

            <div class="form__body">
                <div class="form__row">
                    <label class="form-field" for="first-name">
                        <span class="form-field__label">Your name</span>
                        <input
                            class="form-field__input input input--short"
                            type="text"
                            id="first-name"
                            name="first_name"
                            placeholder="first name"
                        />
                    </label>
                    <label class="form-field" for="last-name">
                        <input
                            class="form-field__input input input--short"
                            type="text"
                            id="last-name"
                            name="last_name"
                            placeholder="last name"
                        />
                    </label>
                </div>

                <div class="form__row">
                    <label class="form-field" for="email">
                        <span class="form-field__label">Your email</span>
                        <input
                            class="form-field__input input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="your_mail@mail.com"
                        />
                    </label>
                </div>

                <div class="form__row">
                    <label class="fform-field" for="phone">
                        <span
                            class="form-field__label form-field__label--requrid"
                            >Phone *</span
                        >
                        <input
                            class="form-field__input input"
                            type="tel"
                            id="phone"
                            name="phone_code"
                            placeholder="012-345-6789"
                            required
                        />
                    </label>
                </div>

                <div class="form__row">
                    <label class="form-field" for="subject">
                        <span class="form-field__label">Message subject *</span>
                        <select
                            class="form-field__select"
                            id="subject"
                            name="subject"
                            required
                        >
                            <option value="other" selected>Other</option>
                        </select>
                    </label>
                </div>

                <div class="form__row">
                    <label class="form-field" for="message">
                        <span class="form-field__label">Message *</span>
                        <textarea
                            class="form-field__textarea"
                            id="message"
                            name="message"
                            required
                        ></textarea>
                    </label>
                </div>
            </div>

            <button class="form__button button" type="submit">
                SUBMIT FORM
            </button>
        </form>
    </body>
</html>
